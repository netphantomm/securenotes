
<!doctype html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
</head>
<body><nav class="account-nav" aria-label="Учётная запись">
    {% if session.get("user_id") %}
        <form method="post" action="{{ url_for('logout_view') }}">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">
            <button type="submit">Выйти</button>
        </form>
    {% else %}
        <a href="{{ url_for('login_view') }}">Войти</a>
        <a href="{{ url_for('register_view') }}">Регистрация</a>
    {% endif %}
</nav>
    <h1>{{ title }}</h1>
    <p>Моя лаборатория безопасности на Flask.</p>

    <h2>Создать заметку</h2>

    <form method="post" action="/notes">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="note-title">Заголовок</label>
        <input id="note-title" name="title" type="text"
               maxlength="120" required>

        <label for="note-body">Текст заметки</label>
        <textarea id="note-body" name="body" rows="4"
                  maxlength="5000" required></textarea>

        <button type="submit">Создать заметку</button>
    </form>

    <h2>Заметки</h2>

    {% for note in notes %}
        <article>
            <h3>{{ note["title"] }}</h3>
            <p>{{ note["body"] }}</p>

            <a href="{{ url_for('edit_note_view', note_id=note['id']) }}">
                Редактировать
            </a>

            <form method="post"
                  action="{{ url_for('delete_note_view', note_id=note['id']) }}">
                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token() }}">

                <button type="submit">Удалить</button>
            </form>
        </article>
    {% else %}
        <p>Заметок пока нет.</p>
    {% endfor %}
</body>
</html>
